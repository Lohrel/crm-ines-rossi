{# A Exclusão tem contorno, para não se confundir com a Inclusão, que é marinho. #}
{% if mov.eh_inclusao %}<span class="badge text-bg-primary">Inclusão</span>
{% elif mov.eh_alteracao %}<span class="badge bg-primary-subtle text-primary-emphasis border border-primary-subtle">Alteração de plano</span>
{% else %}<span class="badge bg-white text-dark border border-dark">Exclusão</span>{% endif %}
