# Sistema completo: banco de dados, aplicação, HTTPS e backup diário.
# Uso: "docker compose up -d --build" (veja docs/instalacao.md).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - arquivos_estaticos:/app/staticfiles
      # Anexos dos beneficiários (DPS etc.). Não passam pelo Caddy: só pelo sistema, com login.
      - anexos:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CRM_HOSTNAME: ${CRM_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - arquivos_estaticos:/srv/static:ro
      - dados_caddy:/data

  backup:
    build: ./docker/backup
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Pasta no próprio servidor. Copie-a para o HD externo e para a nuvem.
      - ./backups:/backups
      - anexos:/anexos

volumes:
  dados_postgres:
  dados_caddy:
  arquivos_estaticos:
  anexos:
