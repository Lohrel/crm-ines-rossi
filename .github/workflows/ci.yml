name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Qualidade e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: chave-apenas-para-ci
      DJANGO_DEBUG: "true"
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Verificar estilo (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Verificar configurações de produção
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ${{ github.run_id }}-chave-longa-e-aleatoria-apenas-para-verificacao-de-seguranca
          DJANGO_ALLOWED_HOSTS: crm.local
        run: python manage.py check --deploy --fail-level WARNING

      # Os testes do backup usam o pg_dump e o pg_restore da mesma versão do banco (16), como a
      # imagem do backup no servidor (postgres:16). O ubuntu-latest passou a trazer um cliente
      # mais novo, cujo backup tem "SET transaction_timeout", que o PostgreSQL 16 não aceita.
      - name: Usar o cliente do PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Rodar testes
        run: |
          pg_dump --version
          pytest

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagens
        run: |
          cp .env.example .env
          docker compose build
