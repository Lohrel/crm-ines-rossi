{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">CRM Corretora</h1>
        {% if form.errors %}
          <div class="alert alert-danger">Usuário ou senha incorretos.</div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Usuário</label>
            <input class="form-control" type="text" name="username" id="{{ form.username.id_for_label }}"
                   autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}">
          </div>
          <div class="mb-4">
            <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
            <input class="form-control" type="password" name="password" id="{{ form.password.id_for_label }}"
                   autocomplete="current-password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
