{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}CRM{% endblock %} · CRM Corretora</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
</head>
<body class="bg-body-tertiary">
  {% if user.is_authenticated %}
  <nav class="navbar navbar-expand bg-primary" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'inicio' %}">CRM Corretora</a>
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text">{{ user.nome_exibicao }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
        </form>
      </div>
    </div>
  </nav>
  {% endif %}

  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>

  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
